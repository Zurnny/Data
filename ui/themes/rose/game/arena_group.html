<rml>
    <head>
        <title>Group</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/components.css" />
        <style>
            #arena-group { width: auto; min-width: 150dp; min-height: 0; max-width: 95vw; padding: 2dp; padding-top: 24dp; }
            #arena-group #window-content { padding: 2dp; }
            #arena-group > .window-title { height: 24dp; line-height: 24dp; padding-left: 4dp; }
            #arena-group > .window-title-close { display: none; }
            #arena-group-panel { display: block; }
            #arena-group.collapsed { padding-bottom: 0; }
            #arena-group.collapsed #window-content { height: 0; min-height: 0; padding: 0; }
            #arena-group.collapsed > .window-title, #arena-group.collapsed .ui-hud-toolbar { visibility: visible; }
            #arena-group .ui-hud-toolbar { top: -24dp; right: 0; flex-direction: row; gap: 2dp; }
            #arena-group .ui-hud-toolbar button { width: 20dp; min-width: 20dp; height: 20dp; padding: 0; margin: 0; }
            #group-settings { decorator: image(party-options-n); }
            #group-settings:hover { decorator: image(party-options-h); }
            #group-leave { decorator: image(party-leave-n); }
            #group-leave:hover { decorator: image(party-leave-h); }
            #group-leave:disabled { decorator: image(party-leave-d); }
            #group-collapse { decorator: none; box-sizing: border-box; border: 2dp rgb(165, 38, 45); border-radius: 10dp; background-color: rgb(40, 32, 32); }
            #group-collapse:hover { border-color: rgb(245, 70, 70); background-color: rgb(70, 40, 40); }
            #group-collapse icon { display: block; width: 10dp; height: 10dp; font-size: 10dp; line-height: 10dp; margin: 3dp; pointer-events: none; }
            #arena-group-members { overflow: auto; max-height: 65vh; }
            .group-columns { display: flex; gap: 0.4em; }
            .group-column { width: 10em; flex-shrink: 0; }
            .group-member { padding: 0; margin-bottom: 0.3em; }
            gauge.group-health { height: 1.5em; margin-top: 0; }
            gauge.group-health > .group-name { height: 1.5em; line-height: 1.5em; font-size: 1em; text-align: right; padding-right: 0.2em; box-sizing: border-box; }
            gauge.group-mana { height: 0.2em; margin-top: 0; }
            .group-statuses { gap: 0.1em; margin-top: 0.1em; min-height: 1em; }
            .group-statuses > span, .group-statuses > span > img { width: 1em; height: 1em; }
            #group-settings-panel { position: absolute; top: 18dp; left: 0dp; z-index: 80; width: 240dp; padding: 4dp; padding-top: 25dp; }
            #group-settings-panel .window-pane { padding: 8dp; }
            #group-settings-panel .ui-range-setting:first-child { margin-top: 0; }
            #arena-group-tooltip { visibility: visible; position: absolute; z-index: 100; clip: none; pointer-events: none; padding: 8dp; width: 250dp; max-width: 90vw; max-height: 90vh; background: rgba(0, 0, 0, 230); border: 1dp rgb(150, 150, 150); border-radius: 3dp; }
            .status-tooltip-name { display: block; font-weight: 820; margin-bottom: 4dp; }
            .status-tooltip-description { display: block; margin-bottom: 4dp; }
            .status-tooltip-time { display: block; color: rgb(90, 230, 110); }
            .status-tooltip-time.warning { color: rgb(255, 170, 60); }
            .status-tooltip-time.danger { color: rgb(255, 80, 80); }
        </style>
    </head>
    <body template="window-fixed-size" id="arena-group" data-model="arena-group" data-class-collapsed="collapsed">
        <div id="arena-group-panel" data-model="arena-group">
            <div class="ui-hud-toolbar">
                <button id="group-collapse" class="ui-hud-action" onclick="collapse"><icon class="arrow-up" data-if="!collapsed" /><icon class="arrow-down" data-if="collapsed" /></button>
                <button id="group-settings" class="ui-hud-action" onclick="settings"></button>
                <button id="group-leave" class="ui-hud-action" onclick="leave" data-attrif-disabled="!can_manage" />
            </div>
            <div id="group-settings-panel" class="window-fixed-size" data-if="show_settings" onclick="ignore">
                <span class="window-title">Group Options</span>
                <button id="group-settings-close" class="window-title-close" onclick="settings" />
                <div class="window-pane">
                    <div class="ui-range-setting">
                        <label><span>Opacity</span><span class="ui-detail-value">{{background_opacity}}%</span></label>
                        <input id="group-opacity" type="range" min="0" max="100" step="5" data-value="background_opacity" onchange="apply-settings" />
                    </div>
                    <div class="ui-range-setting">
                        <label><span>Scale</span><span class="ui-detail-value">{{scale_percent}}%</span></label>
                        <input id="group-scale" type="range" min="55" max="160" step="5" data-value="scale_percent" onchange="apply-settings" />
                    </div>
                </div>
            </div>
            <div id="arena-group-members" data-if="!collapsed" data-style-font-size="members_font_size + 'dp'" data-style-max-height="members_max_height + 'dp'">
                <div class="group-columns">
                    <div class="group-column" data-for="column : columns">
                        <div class="group-member ui-roster-member" data-for="member : column.members" data-attr-id="'group-member-' + member.tag" data-attr-onclick="'select:' + member.tag" data-class-leader="member.leader">
                            <gauge class="group-health ui-vitals horizontal-sm-md red" data-attr-gvalue="member.hp_percent" gmax="100"><span class="group-name ui-roster-name">{{member.name}}</span></gauge>
                            <gauge class="group-mana ui-vitals horizontal-sm-sm blue" data-attr-gvalue="member.mp_percent" gmax="100" />
                            <div class="group-statuses ui-status-icons">
                                <span class="group-status" data-for="status : member.statuses" data-attr-id="'group-status-' + member.tag + '-' + status.key" data-attr-onmouseover="'status-tooltip:' + member.tag + ':' + status.key" onmouseout="hide-tooltip"><img data-attr-sprite="'stateicon-' + status.icon" /></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="arena-group-tooltip" data-if="tooltip_visible" data-style-left="tooltip_x + 'px'" data-style-top="tooltip_y + 'px'">
                <div data-if="tooltip_text != ''">{{tooltip_text}}</div>
                <div data-if="tooltip_text == ''">
                    <div class="status-tooltip-name">{{tooltip_name}}</div>
                    <div class="status-tooltip-description">{{tooltip_description}}</div>
                    <div class="status-tooltip-time" data-class-warning="tooltip_time_class == 'warning'" data-class-danger="tooltip_time_class == 'danger'">{{tooltip_remaining}}</div>
                </div>
            </div>
        </div>
    </body>
</rml>
